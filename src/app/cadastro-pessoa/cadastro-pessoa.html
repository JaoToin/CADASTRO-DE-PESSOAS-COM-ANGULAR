                <input type="date">

                <select name="uf" id="uf">

                    <option value="BH"> BAIHA </option>

                </select>

                <select name="municipio" id="municipio">

                    <option value="MU">MUNICIPIO</option>
                    <option value="ST-AM">SANTO AMARO</option>
                    <option value="SA-CRS">SÃO CRISTOVÃO</option>
                    <option value="ARA">ARACAJU</option>

            </form>
